<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chat | Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1e2c 0%, #2a2f3f 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .chat-container {
            max-width: 750px;
            width: 100%;
            height: 85vh;
            background: rgba(22, 26, 35, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 1rem 1.5rem;
            background: rgba(15, 18, 25, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .connection-dots {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.35rem 0.9rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6b7280;
            transition: all 0.2s ease;
        }

        .connection-dots.online .dot {
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
        }

        .connection-dots.connecting .dot {
            background: #f59e0b;
            animation: dotPulse 1.2s infinite ease-in-out;
        }
        .connection-dots.connecting .dot:nth-child(1) { animation-delay: 0s; }
        .connection-dots.connecting .dot:nth-child(2) { animation-delay: 0.2s; }
        .connection-dots.connecting .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 60%, 100% { transform: scale(1); opacity: 0.6; background: #f59e0b; }
            30% { transform: scale(1.3); opacity: 1; background: #fbbf24; }
        }

        .connection-dots.error .dot {
            background: #ef4444;
            opacity: 0.7;
            box-shadow: 0 0 4px #ef4444;
        }
        .connection-dots.error .dot:nth-child(2) {
            animation: errorBlink 1.8s infinite;
        }
        @keyframes errorBlink {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.3; }
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1.2rem 0.5rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .messages-area::-webkit-scrollbar {
            width: 5px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: #1e2433;
            border-radius: 10px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #4b556b;
            border-radius: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeSlideUp 0.2s ease-out;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            align-self: flex-end;
        }

        .bot-message {
            align-self: flex-start;
        }

        .bubble {
            padding: 0.75rem 1rem;
            border-radius: 1.5rem;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
            background: #1f2937;
            color: #e5e9f0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .user-message .bubble {
            background: linear-gradient(125deg, #3b82f6, #2563eb);
            color: white;
            border-bottom-right-radius: 0.3rem;
        }

        .bot-message .bubble {
            background: #2d3748;
            border-bottom-left-radius: 0.3rem;
            border: 0.5px solid #4b556340;
        }

        .message-time {
            font-size: 0.65rem;
            margin: 0.2rem 0.6rem 0;
            color: #94a3b8;
            display: flex;
            gap: 8px;
        }

        .user-message .message-time {
            justify-content: flex-end;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0.5rem 1rem;
            background: #2d3748;
            border-radius: 2rem;
            width: fit-content;
            border-bottom-left-radius: 0.3rem;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            display: inline-block;
            animation: wave 1.2s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.3s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0s; }
        @keyframes wave {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .input-area {
            background: #11161f;
            padding: 1rem 1.2rem 1.4rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .input-wrapper {
            display: flex;
            gap: 0.7rem;
            background: #1e2636;
            border-radius: 3rem;
            padding: 0.25rem 0.25rem 0.25rem 1.2rem;
            align-items: center;
            transition: all 0.2s;
            border: 1px solid #2d3748;
        }
        .input-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px #3b82f630;
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.8rem 0;
            font-size: 0.95rem;
            color: #f0f3fa;
            outline: none;
            font-family: inherit;
        }
        #messageInput::placeholder {
            color: #6c7a91;
        }

        button {
            background: #3b82f6;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        button:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
        button:active {
            transform: scale(0.96);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-message-hidden {
            display: none;
        }

        @media (max-width: 550px) {
            .message { max-width: 90%; }
            .chat-container { height: 90vh; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="connection-dots" id="connectionDots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendBtn" aria-label="Send message">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    const messagesContainer = document.getElementById('messagesArea');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendBtn');
    const connectionDots = document.getElementById('connectionDots');

    let isBackendHealthy = true;
    let pendingRequest = false;
    let currentTypingElement = null;

    const BACKEND_URL = '/chat';

    function setConnectionState(state) {
        connectionDots.classList.remove('online', 'connecting', 'error');
        if (state === 'online') {
            connectionDots.classList.add('online');
        } else if (state === 'connecting') {
            connectionDots.classList.add('connecting');
        } else if (state === 'error') {
            connectionDots.classList.add('error');
        } else {
            connectionDots.classList.add('error');
        }
    }

    function scrollToBottom() {
        messagesContainer.scrollTo({
            top: messagesContainer.scrollHeight,
            behavior: 'smooth'
        });
    }

    function getFormattedTime() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMessageToUI(text, sender, isError = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;

        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'bubble';
        if (isError && sender === 'bot') {
            bubbleDiv.style.background = '#7f1a1e';
            bubbleDiv.style.border = '1px solid #f87171';
        }
        bubbleDiv.innerText = text;

        const timeSpan = document.createElement('div');
        timeSpan.className = 'message-time';
        timeSpan.innerText = getFormattedTime();

        messageDiv.appendChild(bubbleDiv);
        messageDiv.appendChild(timeSpan);
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
        return messageDiv;
    }

    function removeTypingIndicator() {
        if (currentTypingElement && currentTypingElement.parentNode) {
            currentTypingElement.remove();
            currentTypingElement = null;
        }
    }

    function showTypingIndicator() {
        removeTypingIndicator();
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot-message';
        const indicatorWrapper = document.createElement('div');
        indicatorWrapper.className = 'typing-indicator';
        for (let i = 0; i < 3; i++) {
            const dot = document.createElement('span');
            indicatorWrapper.appendChild(dot);
        }
        typingDiv.appendChild(indicatorWrapper);
        messagesContainer.appendChild(typingDiv);
        scrollToBottom();
        currentTypingElement = typingDiv;
        return typingDiv;
    }

    async function callBackend(userMessage) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        try {
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                },
                body: JSON.stringify({ message: userMessage }),
                signal: controller.signal,
            });
            clearTimeout(timeoutId);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            if (data && typeof data === 'object') {
                if (data.reply) return data.reply;
                if (data.response) return data.response;
                if (data.message) return data.message;
                return JSON.stringify(data);
            }
            return "Response received.";
        } catch (error) {
            clearTimeout(timeoutId);
            if (error.name === 'AbortError') {
                throw new Error('Request timeout');
            }
            throw error;
        }
    }

    function getSmartFallbackReply(userMsg) {
        const lowerMsg = userMsg.toLowerCase();
        if (lowerMsg.includes('hello') || lowerMsg.includes('hi') || lowerMsg === 'hey') {
            return "Hello there! How can I assist?";
        } else if (lowerMsg.includes('how are you')) {
            return "I'm ready to help. What's on your mind?";
        } else if (lowerMsg.includes('test')) {
            return "Connection test complete. Your message arrived safely.";
        } else if (lowerMsg.includes('help')) {
            return "Feel free to ask anything. I'm here to chat.";
        } else if (userMsg.trim().length > 0) {
            return `I received: "${userMsg.substring(0, 70)}"`;
        } else {
            return "Type something and I'll reply.";
        }
    }

    async function sendMessage() {
        const userMessage = messageInput.value.trim();
        if (!userMessage) return;
        if (pendingRequest) {
            const warnMsg = addMessageToUI("Please wait for the current response", "bot", true);
            setTimeout(() => warnMsg.remove(), 1200);
            return;
        }

        pendingRequest = true;
        sendButton.disabled = true;
        messageInput.disabled = true;

        addMessageToUI(userMessage, 'user');
        messageInput.value = '';

        showTypingIndicator();

        let finalReply = "";
        let backendFailed = false;

        setConnectionState('connecting');

        try {
            const reply = await callBackend(userMessage);
            finalReply = reply;
            if (!isBackendHealthy) {
                isBackendHealthy = true;
            }
            setConnectionState('online');
        } catch (err) {
            console.warn('[Chat] backend error:', err);
            backendFailed = true;
            isBackendHealthy = false;
            finalReply = getSmartFallbackReply(userMessage);
            setConnectionState('error');
        }

        removeTypingIndicator();

        addMessageToUI(finalReply, 'bot', false);

        pendingRequest = false;
        sendButton.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();

        if (!backendFailed && isBackendHealthy) {
            setConnectionState('online');
        } else if (backendFailed) {
            setConnectionState('error');
        }
    }

    async function initializeBackendCheck() {
        setConnectionState('connecting');
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "init" }),
                signal: controller.signal,
            });
            clearTimeout(timeoutId);
            if (response.ok) {
                const data = await response.json();
                if (data && (data.reply || data.response || data.message)) {
                    isBackendHealthy = true;
                    setConnectionState('online');
                    addMessageToUI("Connected.", 'bot', false);
                } else {
                    throw new Error("invalid shape");
                }
            } else {
                throw new Error("backend error");
            }
        } catch (err) {
            isBackendHealthy = false;
            setConnectionState('error');
            addMessageToUI("Ready. (local response active)", 'bot', false);
        }
    }

    function initChat() {
        messagesContainer.innerHTML = '';
        addMessageToUI("Chat active. Send a message.", 'bot', false);
        initializeBackendCheck().finally(() => {
            messageInput.focus();
        });
    }

    sendButton.addEventListener('click', (e) => {
        e.preventDefault();
        sendMessage();
    });

    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    initChat();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHI Agent - Control Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 20px;
            font-size: 16px;
        }
        
        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        
        .main-content {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 20px;
        }
        
        .header {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
        }
        
        .user-info {
            text-align: right;
            color: #666;
        }
        
        .user-info .username {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-danger:hover {
            background: #ee5a52;
        }
        
        .btn-success {
            background: #51cf66;
            color: white;
        }
        
        .btn-success:hover {
            background: #40c057;
        }
        
        .section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .mode-selector {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .mode-option {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }
        
        .mode-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .mode-option.active {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .mode-name {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .mode-desc {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .approval-card {
            border: 2px solid #fff59d;
            border-radius: 8px;
            padding: 15px;
            background: #fffde7;
            margin-bottom: 15px;
        }
        
        .approval-title {
            font-weight: 600;
            color: #f57f17;
            margin-bottom: 10px;
        }
        
        .approval-preview {
            background: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
            margin-bottom: 10px;
            max-height: 100px;
            overflow-y: auto;
        }
        
        .approval-buttons {
            display: flex;
            gap: 10px;
        }
        
        .approval-buttons button {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
        }
        
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .voice-input {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .voice-input input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .voice-input button {
            padding: 10px 20px;
        }
        
        .zoom-control {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
        }
        
        .zoom-control input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
        }
        
        .log-viewer {
            max-height: 400px;
            overflow-y: auto;
            background: #f5f5f5;
            border-radius: 6px;
            padding: 10px;
        }
        
        .log-entry {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-time {
            color: #999;
            margin-right: 10px;
        }
        
        .log-operation {
            color: #667eea;
            font-weight: 600;
        }
        
        .log-status-success {
            color: #51cf66;
        }
        
        .log-status-denied {
            color: #ff6b6b;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        
        .status-warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        @media (max-width: 1024px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                position: static;
            }
            
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        
        .scroll-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            flex: 0 0 300px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
        const { useState, useEffect } = React;
        
        function Dashboard() {
            const [user, setUser] = useState(null);
            const [currentMode, setCurrentMode] = useState('normal');
            const [zoom, setZoom] = useState(100);
            const [stats, setStats] = useState({});
            const [logs, setLogs] = useState([]);
            const [voiceInput, setVoiceInput] = useState('');
            const [approvals, setApprovals] = useState([]);
            const token = localStorage.getItem('auth_token');
            
            useEffect(() => {
                loadUserData();
                loadStats();
            }, []);
            
            const loadUserData = async () => {
                try {
                    const response = await fetch('/api/control/permissions', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    setUser(data);
                } catch (error) {
                    console.error('Error loading user data:', error);
                }
            };
            
            const loadStats = async () => {
                try {
                    const response = await fetch('/api/control/stats?hours=24', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    setStats(data.stats || {});
                    
                    const logsResponse = await fetch('/api/control/audit-log?hours=24&limit=20', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const logsData = await logsResponse.json();
                    setLogs(logsData.logs || []);
                } catch (error) {
                    console.error('Error loading stats:', error);
                }
            };
            
            const setMode = async (mode) => {
                try {
                    const response = await fetch('/api/control/modes/set', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ mode })
                    });
                    const data = await response.json();
                    if (data.success) {
                        setCurrentMode(mode);
                    }
                } catch (error) {
                    console.error('Error setting mode:', error);
                }
            };
            
            const processVoiceCommand = async () => {
                if (!voiceInput.trim()) return;
                
                try {
                    const response = await fetch('/api/control/voice/command', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ command: voiceInput, type: 'text' })
                    });
                    const data = await response.json();
                    
                    if (data.action === 'exit') {
                        exitAll();
                    } else if (data.action === 'zoom') {
                        setZoom(data.zoom_level);
                    }
                    
                    setVoiceInput('');
                } catch (error) {
                    console.error('Error processing voice command:', error);
                }
            };
            
            const exitAll = async () => {
                try {
                    await fetch('/api/control/exit-all', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    localStorage.removeItem('auth_token');
                    window.location.href = '/login';
                } catch (error) {
                    console.error('Error exiting:', error);
                }
            };
            
            return (
                <div className="dashboard" style={{ fontSize: `${zoom / 100}rem` }}>
                    <div className="sidebar">
                        <div className="section">
                            <div className="section-title">Modes</div>
                            <div className="mode-selector">
                                {['normal', 'private', 'guest', 'incognito'].map(mode => (
                                    <div
                                        key={mode}
                                        className={`mode-option ${currentMode === mode ? 'active' : ''}`}
                                        onClick={() => setMode(mode)}
                                    >
                                        <div className="mode-name">{mode.charAt(0).toUpperCase() + mode.slice(1)}</div>
                                        <div className="mode-desc">
                                            {mode === 'normal' && 'Full logging'}
                                            {mode === 'private' && 'Selective logging'}
                                            {mode === 'guest' && 'Limited access'}
                                            {mode === 'incognito' && 'Max privacy'}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        
                        <div className="section" style={{ marginTop: '20px' }}>
                            <div className="section-title">Controls</div>
                            <div className="zoom-control">
                                <label>Zoom: {zoom}%</label>
                                <input
                                    type="range"
                                    min="50"
                                    max="300"
                                    value={zoom}
                                    onChange={(e) => setZoom(parseInt(e.target.value))}
                                />
                            </div>
                            <button className="btn-danger" onClick={exitAll} style={{ width: '100%', marginTop: '10px' }}>
                                Exit All
                            </button>
                        </div>
                    </div>
                    
                    <div className="main-content">
                        <div className="header">
                            <h1>PHI Agent Control Dashboard</h1>
                            <div className="user-info">
                                <div className="username">Welcome, User</div>
                                <div style={{ fontSize: '12px', color: '#999', marginTop: '5px' }}>Active Session</div>
                            </div>
                        </div>
                        
                        <div>
                            <div className="section">
                                <div className="section-title">Voice Commands</div>
                                <div className="voice-input">
                                    <input
                                        type="text"
                                        placeholder="Say or type command... (e.g., 'approve', 'exit', 'zoom 150')"
                                        value={voiceInput}
                                        onChange={(e) => setVoiceInput(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && processVoiceCommand()}
                                    />
                                    <button className="btn-primary" onClick={processVoiceCommand}>Send</button>
                                </div>
                            </div>
                            
                            <div className="grid-2">
                                <div className="section">
                                    <div className="section-title">Activity Statistics</div>
                                    <div className="stat-grid">
                                        <div className="stat-box">
                                            <div className="stat-label">Total Accesses</div>
                                            <div className="stat-value">{stats.total_accesses || 0}</div>
                                        </div>
                                        <div className="stat-box">
                                            <div className="stat-label">Approved</div>
                                            <div className="stat-value">{stats.approved || 0}</div>
                                        </div>
                                        <div className="stat-box">
                                            <div className="stat-label">Denied</div>
                                            <div className="stat-value">{stats.denied || 0}</div>
                                        </div>
                                        <div className="stat-box">
                                            <div className="stat-label">Data (KB)</div>
                                            <div className="stat-value">{Math.round(stats.data_extracted_kb || 0)}</div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="section">
                                    <div className="section-title">Recent Activity</div>
                                    <div className="log-viewer">
                                        {logs.length === 0 ? (
                                            <div style={{ color: '#999', textAlign: 'center', padding: '20px' }}>
                                                No activity yet
                                            </div>
                                        ) : (
                                            logs.map((log, i) => (
                                                <div key={i} className="log-entry">
                                                    <span className="log-time">{new Date(log.timestamp).toLocaleTimeString()}</span>
                                                    <span className="log-operation">{log.operation}</span>
                                                    <span className={`log-status-${log.status}`}> [{log.status}]</span>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<Dashboard />, document.getElementById('app'));
    </script>
</body>
</html>

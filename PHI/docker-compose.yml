version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: phi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - session_db:/data
    logging: *default-logging
    networks:
      - phi-net

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phi-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - workspace:/app/workspace
      - audio_store:/app/workspace/audio
      - memory_store:/app/memory_store
      - companion_memory:/app/companion
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - phi-net

  speech:
    image: python:3.12-slim
    container_name: phi-speech
    ports:
      - "${SPEECH_PORT:-8765}:8765"
    entrypoint: ["sleep", "infinity"]
    logging: *default-logging
    networks:
      - phi-net

  monitoring:
    image: prom/prometheus:latest
    container_name: phi-monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    logging: *default-logging
    networks:
      - phi-net

volumes:
  session_db:
  audio_store:
  memory_store:
  workspace:
  companion_memory:
  prometheus_data:

networks:
  phi-net:
    driver: bridge

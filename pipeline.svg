<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Title -->
  <text x="450" y="30" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="bold" fill="#1a1a2e">PHI Agent — Training & Deployment Pipeline</text>

  <!-- Step 1: Data Ingestion -->
  <rect x="30" y="60" width="150" height="100" rx="12" fill="#4361ee" stroke="#3a56d4" stroke-width="2"/>
  <text x="105" y="85" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Data Ingestion</text>
  <text x="105" y="102" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0e7ff">Documents (PDF/DOCX)</text>
  <text x="105" y="115" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0e7ff">Web scraping (Scrapy)</text>
  <text x="105" y="128" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0e7ff">APIs (Google, etc.)</text>
  <text x="105" y="141" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0e7ff">User conversations</text>

  <!-- Arrow -->
  <line x1="180" y1="110" x2="210" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#tarr)"/>

  <!-- Step 2: Processing -->
  <rect x="210" y="60" width="150" height="100" rx="12" fill="#7209b7" stroke="#6308a0" stroke-width="2"/>
  <text x="285" y="85" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Processing</text>
  <text x="285" y="102" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0c3fc">Text extraction</text>
  <text x="285" y="115" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0c3fc">Chunking (512 tokens)</text>
  <text x="285" y="128" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0c3fc">Clean & normalize</text>
  <text x="285" y="141" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0c3fc">Metadata tagging</text>

  <!-- Arrow -->
  <line x1="360" y1="110" x2="390" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#tarr)"/>

  <!-- Step 3: Embeddings -->
  <rect x="390" y="60" width="150" height="100" rx="12" fill="#f72585" stroke="#d91e72" stroke-width="2"/>
  <text x="465" y="85" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Embeddings</text>
  <text x="465" y="102" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#ffd6e7">sentence-transformers</text>
  <text x="465" y="115" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#ffd6e7">Vector generation</text>
  <text x="465" y="128" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#ffd6e7">Dimensionality: 384</text>
  <text x="465" y="141" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#ffd6e7">Batch processing</text>

  <!-- Arrow -->
  <line x1="540" y1="110" x2="570" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#tarr)"/>

  <!-- Step 4: Vector Store -->
  <rect x="570" y="60" width="140" height="100" rx="12" fill="#4cc9f0" stroke="#3db8de" stroke-width="2"/>
  <text x="640" y="85" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">ChromaDB</text>
  <text x="640" y="102" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0f7fa">Vector storage</text>
  <text x="640" y="115" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0f7fa">Similarity search</text>
  <text x="640" y="128" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0f7fa">CRUD operations</text>
  <text x="640" y="141" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0f7fa">Persistent storage</text>

  <!-- Arrow -->
  <line x1="710" y1="110" x2="740" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#tarr)"/>

  <!-- Step 5: Retrieval -->
  <rect x="740" y="60" width="130" height="100" rx="12" fill="#06d6a0" stroke="#05c493" stroke-width="2"/>
  <text x="805" y="85" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">RAG Retrieval</text>
  <text x="805" y="102" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0fff5">Query embedding</text>
  <text x="805" y="115" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0fff5">Top-K retrieval</text>
  <text x="805" y="128" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0fff5">Context injection</text>
  <text x="805" y="141" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#e0fff5">Re-ranking</text>

  <!-- Vertical connector -->
  <line x1="450" y1="160" x2="450" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#tarr)"/>

  <!-- LLM Layer -->
  <rect x="30" y="190" width="840" height="80" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="2"/>
  <text x="450" y="213" font-size="13" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold" fill="#92400e">LLM Inference Layer</text>
  
  <rect x="55" y="225" width="150" height="35" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="130" y="247" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">OpenAI GPT-4</text>
  
  <rect x="220" y="225" width="150" height="35" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="295" y="247" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Anthropic Claude</text>
  
  <rect x="385" y="225" width="150" height="35" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="460" y="247" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Context + RAG</text>
  
  <rect x="550" y="225" width="150" height="35" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="625" y="247" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Tool Selection</text>
  
  <rect x="715" y="225" width="140" height="35" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="785" y="247" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Response Gen</text>

  <!-- Vertical connector -->
  <line x1="450" y1="270" x2="450" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#tarr)"/>

  <!-- Deployment -->
  <rect x="30" y="300" width="840" height="80" rx="10" fill="#d1fae5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="450" y="323" font-size="13" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold" fill="#065f46">Deployment Options</text>
  
  <rect x="55" y="335" width="140" height="35" rx="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <text x="125" y="357" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Docker Compose</text>
  
  <rect x="210" y="335" width="140" height="35" rx="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <text x="280" y="357" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Railway Cloud</text>
  
  <rect x="365" y="335" width="140" height="35" rx="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <text x="435" y="357" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Electron Desktop</text>
  
  <rect x="520" y="335" width="140" height="35" rx="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <text x="590" y="357" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Local Python</text>
  
  <rect x="675" y="335" width="175" height="35" rx="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <text x="762" y="357" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Prometheus Monitoring</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="tarr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
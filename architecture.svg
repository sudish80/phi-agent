<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Title -->
  <text x="450" y="30" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="bold" fill="#1a1a2e">PHI Agent — J.A.R.V.I.S. Architecture</text>


  <rect x="605" y="88" width="120" height="35" rx="6" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="665" y="110" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">MQTT IoT</text>
  

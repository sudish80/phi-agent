  <text x="470" y="375" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#d1fae5">pyautogui</text>
  <text x="470" y="387" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#d1fae5">Screen control</text>
  

  <text x="815" y="375" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#d1fae5">GitPython</text>
  <text x="815" y="387" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#d1fae5">Repo mgmt</text>


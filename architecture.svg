  <text x="710" y="387" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#d1fae5">PyMuPDF, openpyxl</text>
  
  <rect x="775" y="340" width="80" height="60" rx="8" fill="#10b981" stroke="#059669" stroke-width="1.5"/>

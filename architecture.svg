  <rect x="190" y="480" width="120" height="35" rx="6" fill="#ec4899" stroke="#db2777" stroke-width="1.5"/>
  <text x="250" y="502" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Google APIs</text>
  
  <rect x="325" y="480" width="120" height="35" rx="6" fill="#ec4899" stroke="#db2777" stroke-width="1.5"/>
  <text x="385" y="502" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">MQTT IoT</text>
  
  <rect x="460" y="480" width="120" height="35" rx="6" fill="#ec4899" stroke="#db2777" stroke-width="1.5"/>
  <text x="520" y="502" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Notifications</text>
  
  <rect x="595" y="480" width="120" height="35" rx="6" fill="#ec4899" stroke="#db2777" stroke-width="1.5"/>
  <text x="655" y="502" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Electron App</text>
  
  <rect x="730" y="480" width="125" height="35" rx="6" fill="#ec4899" stroke="#db2777" stroke-width="1.5"/>
  <text x="792" y="502" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Docker Deploy</text>

  <!-- Arrow marker -->
